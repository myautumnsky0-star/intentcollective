<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discourse — Intent Collective</title>
<meta name="description" content="Writing from Intent Collective fellows.">
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="wordmark-link">
      <img src="assets/wordmark.png" alt="Intent Collective">
    </a>
    <nav class="site-nav">
      <a href="index.html">Index</a>
      <a href="structure.html">Structure</a>
      <a href="discourse.html" aria-current="page">Discourse</a>
      <a href="news.html">News</a>
    </nav>
  </div>
</header>

<main>
  <section class="page-head">
    <div class="wrap">
      <div class="mark-label">Discourse</div>
      <h1>Writing from the fellows.</h1>
      <p class="lede">
        Entries are pulled live from a shared Google Sheet. Click any entry to read it in full.
      </p>
    </div>
  </section>

  <div class="wrap">

    <div id="composer-region">
      <button type="button" id="compose-toggle" class="compose-toggle">+ Share a post</button>

      <div id="composer" class="composer hidden">
        <div class="field">
          <label for="compose-name">Name</label>
          <input type="text" id="compose-name" placeholder="Your name">
        </div>

        <div class="field">
          <label for="compose-title">Title</label>
          <input type="text" id="compose-title" placeholder="Post title">
        </div>

        <div class="field">
          <label for="rte-body">Content</label>
          <div class="rte-toolbar" role="toolbar" aria-label="Formatting">
            <button type="button" data-cmd="bold" title="Bold"><b>B</b></button>
            <button type="button" data-cmd="italic" title="Italic"><i>I</i></button>
            <button type="button" data-cmd="underline" title="Underline"><u>U</u></button>
            <select id="rte-block" title="Paragraph style" aria-label="Paragraph style">
              <option value="">Style…</option>
              <option value="p">Paragraph</option>
              <option value="h3">Heading</option>
              <option value="blockquote">Quote</option>
            </select>
            <button type="button" data-cmd="insertUnorderedList" title="Bulleted list">• List</button>
            <button type="button" data-cmd="insertOrderedList" title="Numbered list">1. List</button>
            <button type="button" data-cmd="createLink" title="Insert link">Link</button>
            <button type="button" data-cmd="removeFormat" title="Clear formatting">Clear</button>
          </div>
          <div id="rte-body" class="rte-body" contenteditable="true" aria-label="Post content"></div>
        </div>

        <div class="composer-actions">
          <input type="password" id="compose-password" placeholder="Password to publish">
          <button type="button" id="publish-btn" class="btn-primary">Publish</button>
          <span id="composer-status" class="composer-status" aria-live="polite"></span>
        </div>
      </div>
    </div>

    <div class="discourse-toolbar" id="discourse-toolbar">
      <span class="count" id="entry-count" aria-live="polite"></span>
    </div>

    <div id="state" class="state-msg">Loading entries…</div>
    <div id="entry-grid" class="entry-grid" hidden></div>

    <article id="post-detail" class="post-detail" hidden></article>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <span>&copy; <span id="year"></span> intent collective&trade;</span>
    <span>we design everything</span>
  </div>
</footer>

<script src="js/discourse.js"></script>
<script>document.getElementById('year').textContent = new Date().getFullYear();</script>

</body>
</html>
